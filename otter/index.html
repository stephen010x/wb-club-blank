<script src="https://www.youtube.com/iframe_api"></script>
<script>
    const VIDEO_IDS = [
        'NqOmHpwMUxs',
        'abbR-Ttd-cA',
        '_KXHUb0wFRE',
        'SnHke968zAA',
        '5e4lsEe4Vew',
        '-uooI2satIQ',
        'W8azQI76EQc',
        'DHUnz4dyb54',
    ];
    const START_TIMEOUT_MS = 15000;
    const ERRORS = {
        2: 'invalid id',
        5: 'HTML5 player error',
        100: 'not found / private',
        101: 'embedding disabled',
        150: 'embedding disabled',
    };

    let queue = [], player, timer, current;

    function shuffle(a) {
        a = a.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function playNext() {
        clearTimeout(timer);
        if (queue.length === 0) queue = shuffle(VIDEO_IDS);
        const id = current = queue.pop();
        console.log('testing   ' + id);
        player.loadVideoById(id);
        timer = setTimeout(() => {
            console.log('FAIL      ' + id + ' (no playback after ' + START_TIMEOUT_MS / 1000 + 's)');
            playNext();
        }, START_TIMEOUT_MS);
    }

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('video', {
            host: 'https://www.youtube-nocookie.com',
            width: '100%',
            height: '100%',
            playerVars: { autoplay: 1, mute: 1, controls: 0, modestbranding: 1, rel: 0 },
            events: {
                onReady: () => { player.mute(); playNext(); },
                onStateChange: (e) => {
                    if (e.data === YT.PlayerState.PLAYING) {
                        if (timer) console.log('OK        ' + current);
                        clearTimeout(timer);
                        timer = null;
                    }
                    if (e.data === YT.PlayerState.ENDED) playNext();
                },
                onError: (e) => {
                    console.log('FAIL      ' + current + ' (' + (ERRORS[e.data] || 'error ' + e.data) + ')');
                    setTimeout(playNext, 500);
                },
            },
        });
    }

    document.addEventListener('click', () => {
        const el = document.documentElement;
        (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    });
</script>
